name: Publish

on:
  push:
    branches: [main]
    tags: ['**']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish multi-architecture images
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin

      - name: Publish multi-architecture images
        env:
          IMAGE_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          docker buildx create --name gitea-pages --use || docker buildx use gitea-pages
          deployer_tags="-t ${IMAGE_PREFIX}/deployer:${GITHUB_SHA}"
          nginx_tags="-t ${IMAGE_PREFIX}/nginx:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            deployer_tags="$deployer_tags -t ${IMAGE_PREFIX}/deployer:latest"
            nginx_tags="$nginx_tags -t ${IMAGE_PREFIX}/nginx:latest"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="$GITHUB_REF_NAME"
            if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              tag_hash=$(printf '%s' "$image_tag" | sha256sum | cut -c1-12)
              tag_prefix=$(printf '%s' "$image_tag" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[^A-Za-z0-9_]+/_/')
              image_tag="${tag_prefix:0:115}-${tag_hash}"
            fi
            deployer_tags="$deployer_tags -t ${IMAGE_PREFIX}/deployer:${image_tag}"
            nginx_tags="$nginx_tags -t ${IMAGE_PREFIX}/nginx:${image_tag}"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push $deployer_tags ./deployer
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg PAGES_DOMAIN=example.com --push $nginx_tags ./nginx
