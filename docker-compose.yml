# Production topology: only Nginx publishes a host port. Deployer is reachable
# through the explicit <DOMAIN> Nginx virtual host on the private network.
x-service-defaults: &service-defaults
  restart: unless-stopped
  user: "${PAGES_UID:-1000}:${PAGES_GID:-1000}"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128

services:
  nginx:
    <<: *service-defaults
    image: ghcr.io/kekxv/gitea-pages/nginx:latest
    build:
      context: ./nginx
      args:
        PUID: ${PAGES_UID:-1000}
        PGID: ${PAGES_GID:-1000}
    ports:
      - "${PAGES_HTTP_PORT:-80}:8080"
    environment:
      PAGES_DOMAIN: ${PAGES_DOMAIN:?PAGES_DOMAIN must be set to the complete Pages domain}
      PAGES_DEPLOYER_UPSTREAM: ${PAGES_DEPLOYER_UPSTREAM:-deployer:8080}
    volumes:
      - type: bind
        source: ${PAGES_DATA_DIR:-./pages/webroot}
        target: /var/www/pages
        read_only: true
    cpus: "0.50"
    mem_limit: 128M
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=${PAGES_UID:-1000},gid=${PAGES_GID:-1000},mode=700
      - /var/cache/nginx:rw,nosuid,nodev,noexec,uid=${PAGES_UID:-1000},gid=${PAGES_GID:-1000},mode=700
    depends_on:
      deployer:
        condition: service_started
    networks:
      - pages_frontend
      - pages_backend

  deployer:
    <<: *service-defaults
    image: ghcr.io/kekxv/gitea-pages/deployer:latest
    build:
      context: ./deployer
      args:
        PUID: ${PAGES_UID:-1000}
        PGID: ${PAGES_GID:-1000}
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${PAGES_DATA_DIR:-./pages/webroot}
        target: /var/www/pages
      - deployer_data:/var/lib/deployer:rw
    environment:
      DOMAIN: ${PAGES_DOMAIN:?PAGES_DOMAIN must be set to the complete Pages domain}
      APP_ENV: ${PAGES_APP_ENV:-production}
      WEBHOOK_PORT: "8080"
      PAGES_DATA_DIR: /var/www/pages
      DEPLOYER_DATA_DIR: /var/lib/deployer
      GITEA_API_URL: ${PAGES_GITEA_API_URL:-}
      GITEA_PUBLIC_URL: ${PAGES_GITEA_PUBLIC_URL:-}
      OAUTH_CLIENT_ID: ${PAGES_OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${PAGES_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URL: https://${PAGES_DOMAIN:?PAGES_DOMAIN must be set to the complete Pages domain}/oauth/callback
      WEBHOOK_PUBLIC_URL: https://${PAGES_DOMAIN:?PAGES_DOMAIN must be set to the complete Pages domain}/webhook
      MAX_SITE_SIZE_MB: ${PAGES_MAX_SITE_SIZE_MB:-100}
      MAX_REPOSITORY_SIZE_MB: ${PAGES_MAX_REPOSITORY_SIZE_MB:-1024}
      MAX_CONCURRENT_DEPLOYS: ${PAGES_MAX_CONCURRENT_DEPLOYS:-4}
      CLONE_TIMEOUT: ${PAGES_CLONE_TIMEOUT:-1m}
      ACQUIRE_TIMEOUT: ${PAGES_ACQUIRE_TIMEOUT:-30s}
      ENABLE_ORGANIZATION_HOOKS: ${PAGES_ENABLE_ORGANIZATION_HOOKS:-true}
    cpus: "1.00"
    mem_limit: 512M
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,uid=${PAGES_UID:-1000},gid=${PAGES_GID:-1000},mode=700,size=256m
    networks:
      - pages_backend
      - deployer_egress

volumes:
  deployer_data:
    name: gitea-pages-deployer-data

networks:
  pages_frontend:
  pages_backend:
    internal: true
  deployer_egress:
